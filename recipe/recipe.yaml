schema_version: 1

context:
  name: phasepy
  version: "0.0.56"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/gustavochm/phasepy/archive/v${{ version }}.tar.gz
  sha256: 7ea9d8c7def1da78958c8ba5373b01c4d1b2699beca7c5fc19e483e4f3c9c5f0

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - pip
    - python
    - setuptools
    - cython
    - numpy
  run:
    - numpy
    - pandas
    - python
    - scipy
    - openpyxl

tests:
  - python:
      imports:
        - phasepy
        - phasepy.actmodels
      pip_check: true

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Multiphase multicomponent Equilibria
  description: |
    Phasepy is an open-source scientific Python package for calculation
    of physical properties of phases at thermodynamic equilibrium. Main
    application areas include computation of fluid phase equilibria and
    interfacial properties.
  homepage: https://github.com/gustavochm/phasepy
  repository: https://github.com/gustavochm/phasepy
  documentation: https://github.com/gustavochm/phasepy

extra:
  recipe-maintainers:
    - jan-janssen
